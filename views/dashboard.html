<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Requests — Steppin' Out Dashboard</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4292d8;--deep:#1b5fa3;--pink:#e2368e;--ink:#121826;--cream:#fffaf2;--line:#e6dfd2}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#f4efe6;color:var(--ink)}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:5}
header img{height:42px;background:#fff;border-radius:8px;padding:3px}
header h1{font-family:Rye,serif;font-weight:400;font-size:20px;margin:0;flex:1}
header button{background:transparent;color:#fff;border:1px solid #fff5;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stat b{display:block;font-size:28px}.stat span{color:#666;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:10px}
.card h3{margin:0 0 4px;font-size:18px}.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;margin-right:6px}
.t-class{background:#dcebfa;color:var(--deep)}.t-party{background:#fde0ee;color:#a1135e}.t-contact{background:#eee;color:#444}
.meta{color:#555;font-size:14px;margin:6px 0}.meta a{color:var(--deep);font-weight:700}
.msg{white-space:pre-wrap;background:#faf7f1;border-radius:10px;padding:10px;margin-top:8px;font-size:15px}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
select{font:inherit;padding:7px;border-radius:8px;border:2px solid var(--line)}
.del{background:#fff;border:2px solid #d33;color:#d33;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.del:hover{background:#d33;color:#fff}
textarea{width:100%;margin-top:8px;font:inherit;font-size:14px;border:1px dashed #ccc;border-radius:8px;padding:8px;min-height:38px}
.empty{text-align:center;color:#777;padding:50px 0}
time{color:#888;font-size:13px}
@media(max-width:640px){.card{grid-template-columns:1fr}.side{flex-direction:row;align-items:center;justify-content:space-between}}
</style></head><body>
<header><img src="/img/logo.png" alt=""><h1>Studio Requests</h1>
<form method="post" action="/admin/logout"><button>Sign out</button></form></header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
let rows=[],statuses=[],filter='all';
const KIND={class:'Class inquiry',party:'Birthday party',contact:'Message'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const r=await fetch('/admin/api/inquiries');if(r.status===401)return location.href='/admin/login';
  const j=await r.json();rows=j.rows;statuses=j.statuses;render();
}
function render(){
  const c=k=>rows.filter(r=>r.kind===k).length;
  document.getElementById('stats').innerHTML=
    `<div class="stat"><b>${rows.filter(r=>r.status==='new').length}</b><span>New</span></div>
     <div class="stat"><b>${c('class')}</b><span>Class inquiries</span></div>
     <div class="stat"><b>${c('party')}</b><span>Party requests</span></div>
     <div class="stat"><b>${c('contact')}</b><span>Messages</span></div>`;
  const tabs=[['all','All'],['new','New'],['class','Classes'],['party','Parties'],['contact','Messages']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  const list=rows.filter(r=>filter==='all'||r.status===filter||r.kind===filter);
  document.getElementById('list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">Nothing here yet.</p>';
}
function card(r){
  let d={};try{d=JSON.parse(r.details||'{}')}catch(e){}
  const extra=r.kind==='party'?[d.date&&`Date: ${esc(d.date)}`,d.slot&&`Time: ${esc(d.slot)}`,d.instructor&&`Teacher: ${esc(d.instructor)}`,d.music&&`Music: ${esc(d.music)}`,d.games&&`Games: ${esc(d.games)}`].filter(Boolean).join(' · '):'';
  return `<div class="card" data-id="${r.id}"><div>
    <span class="tag t-${r.kind}">${KIND[r.kind]||r.kind}</span><time>${new Date(r.created_at.replace(' ','T')+'Z').toLocaleString()}</time>
    <h3>${esc(r.name)}</h3>
    <div class="meta">${r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> · `:''}${r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}</div>
    ${(r.dancer_name||r.dancer_age||r.interest)?`<div class="meta">${r.dancer_name?'Dancer: <b>'+esc(r.dancer_name)+'</b> ':''}${r.dancer_age?'(age '+esc(r.dancer_age)+') ':''}${r.interest?'· '+esc(r.interest):''}</div>`:''}
    ${extra?`<div class="meta">${extra}</div>`:''}
    ${r.message?`<div class="msg">${esc(r.message)}</div>`:''}
    <textarea placeholder="Private notes…" data-notes>${esc(r.notes)}</textarea>
  </div><div class="side">
    <select data-status>${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>
    <button class="del" data-del>Delete</button>
  </div></div>`;
}
document.addEventListener('click',async e=>{
  if(e.target.dataset.f){filter=e.target.dataset.f;render()}
  if(e.target.hasAttribute('data-del')){
    const id=e.target.closest('.card').dataset.id;
    if(!confirm('Delete this request for good?'))return;
    const r=await fetch('/admin/api/inquiries/'+id,{method:'DELETE'});
    if(r.ok){rows=rows.filter(x=>String(x.id)!==id);render()}
  }
});
document.addEventListener('change',async e=>{
  if(e.target.hasAttribute('data-status')){
    const id=e.target.closest('.card').dataset.id;
    await fetch('/admin/api/inquiries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.value})});
    rows.find(x=>String(x.id)===id).status=e.target.value;render();
  }
  if(e.target.hasAttribute('data-notes')){
    const id=e.target.closest('.card').dataset.id;
    await fetch('/admin/api/inquiries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:e.target.value})});
    rows.find(x=>String(x.id)===id).notes=e.target.value;
  }
});
load();
</script></body></html>
